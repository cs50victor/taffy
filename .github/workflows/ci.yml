name: Visual CLI
on:
  pull_request:
  push:
    branches: [main, feat/visual-web-cli]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.os }}
          path: test-results
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [bun-darwin-arm64, bun-darwin-x64, bun-linux-arm64, bun-linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ matrix.target }}
      - run: tar -czf taffy-${{ matrix.target }}.tar.gz -C dist taffy -C .. LICENSE THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: taffy-${{ matrix.target }}
          path: taffy-${{ matrix.target }}.tar.gz
